name: 寶可夢每日看板

on:
  schedule:
    - cron: "0 17 * * *"  # 每天 UTC 17:00 = 台灣 01:00
  workflow_dispatch:
  # PR 上只抓資料檢查來源是否正常，不送到 Apps Script
  pull_request:

concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest

      - name: 抓資料並送到 Apps Script
        env:
          GAS_INGEST_URL: ${{ github.event_name != 'pull_request' && secrets.GAS_INGEST_URL || '' }}
          GAS_INGEST_SECRET: ${{ secrets.GAS_INGEST_SECRET }}
        run: python -m scraper.main

      - name: 保存當天資料（除錯用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: out/payload.json
          retention-days: 7
