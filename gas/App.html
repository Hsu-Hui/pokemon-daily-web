<script>
const TABS = [['overview', '總覽'], ['go', 'GO 活動'], ['tasks', '任務待辦'], ['shop', '新商品'], ['tw', '活動&新聞'], ['fav', '我的最愛'], ['archive', '封存']];
const TYPE_COLORS = {
  '社群日': ['#DDF3E4', '#155B30'], '社群日經典': ['#DDF3E4', '#155B30'],
  '團體戰': ['#ECE3FA', '#4B2A85'], '團體戰日': ['#ECE3FA', '#4B2A85'], '團體戰時間': ['#ECE3FA', '#4B2A85'],
  '極巨對戰': ['#ECE3FA', '#4B2A85'], '極巨星期一': ['#ECE3FA', '#4B2A85'],
  '聚焦時刻': ['#FDEBD3', '#7A4200'], '活動': ['#DCEAFE', '#163F7A'], '調查': ['#E6E8EC', '#30353F'],
};
const DAY = 864e5, HOUR = 36e5;
// 分類、提醒時數、保留天數來自 shared/board.json（getData 回傳的 config），載入後設定
let CATEGORIES = [], REMIND_MS = 0, CONFIG = {};
const FEEDS = ['新聞', '官方', '活動'];
const PAGE_SIZE = 25;
// goCats、feeds 是多選，空陣列代表「全部」；goSort.key 為 null 時用預設排序（類型 → 開始 → 結束）
// draft：任務勾選的草稿（key → true/false），按「儲存」才送出；saving：儲存中
// calWeek：行事曆從本週往後移幾週；calOpen：行事曆是否展開
const ui = { draft: {}, saving: false, tab: 'overview', goCats: [], feeds: [], goSort: { key: null, dir: 1 }, shopSort: 'new', shopQuery: '', page: {}, calWeek: 0, calOpen: true, taskOpen: {} };
let data = null;
try { ui.tab = localStorage.getItem('tab') || 'overview'; } catch (e) {}
try { ui.calOpen = localStorage.getItem('calOpen') !== '0'; } catch (e) {}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const when = (iso) => iso ? fmt.format(new Date(iso)) : '未定';
const leftText = (ms) => ms <= 0 ? '已結束' : ms < 48 * HOUR ? `${Math.max(1, Math.floor(ms / HOUR))} 小時` : `${Math.floor(ms / DAY)} 天`;
const tagHtml = (type) => {
  const c = TYPE_COLORS[type];
  return `<span class="tag"${c ? ` style="background:${c[0]};color:${c[1]}"` : ''}>${esc(type)}</span>`;
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function setFlag(kind, id, value) {
  const prev = !!data.state[kind][id];
  if (value) data.state[kind][id] = true; else delete data.state[kind][id];
  render();
  google.script.run
    .withSuccessHandler((state) => { data.state = state; render(); })
    .withFailureHandler(() => {
      if (prev) data.state[kind][id] = true; else delete data.state[kind][id];
      render(); toast('儲存失敗，請再試一次');
    })
    .setFlag(kind, id, value);
}

// ---------- 任務勾選草稿 ----------

// 限時調查（LeekDuck ld-、巴哈 bh-）照順序做；田野調查（field-）各自獨立
const isSequential = (groupId) => /^(ld|bh)-/.test(groupId);
const taskKey = (g, t, i) => g.id + '#' + (t.id || i);
const savedDone = (key) => !!data.state.taskDone[key];
const isDone = (key) => (key in ui.draft ? ui.draft[key] : savedDone(key));

/** 勾或取消第 index 項：限時調查勾第 N 項時 1～N 都勾，取消第 N 項時 N 之後都取消。 */
function toggleTask(groupId, index, checked) {
  const g = data.tasks.find((x) => x.id === groupId);
  if (!g) return;
  const keys = g.tasks.map((t, i) => taskKey(g, t, i));
  const targets = !isSequential(groupId) ? [keys[index]] : checked ? keys.slice(0, index + 1) : keys.slice(index);
  targets.forEach((key) => {
    if (checked === savedDone(key)) delete ui.draft[key];
    else ui.draft[key] = checked;
  });
  render();
}

const draftCount = () => Object.keys(ui.draft).length;

function saveDraft() {
  if (!draftCount() || ui.saving) return;
  ui.saving = true;
  renderSaveBar();
  google.script.run
    .withSuccessHandler((state) => { data.state = state; ui.draft = {}; ui.saving = false; render(); toast('已儲存'); })
    .withFailureHandler(() => { ui.saving = false; render(); toast('儲存失敗，請再試一次'); })
    .saveTasks(Object.assign({}, ui.draft));
}

function renderSaveBar() {
  const n = draftCount();
  const bar = document.getElementById('savebar');
  // 儲存列只放在任務待辦；草稿在其他分頁仍保留
  if (ui.tab !== 'tasks') { bar.innerHTML = ''; return; }
  bar.innerHTML = `<div class="wrap savebar-inner">
    <span class="${n ? 'soon' : 'muted'}" style="font-size:14px;font-weight:700">${ui.saving ? '儲存中…' : n ? `有 ${n} 項變更未儲存` : '已儲存'}</span>
    <button type="button" class="save" data-save ${n && !ui.saving ? '' : 'disabled'}>儲存</button>
  </div>`;
}

// ---------- 我的最愛 ----------

// 收藏時存的快照：新聞和商品用同一個格式
const newsSnapshot = (n) => ({ kind: 'news', id: n.id, title: n.title, url: n.url, source: n.source, media: '', price: '', image: '', date: n.published || n.firstSeen || '' });
const productSnapshot = (p) => ({ kind: 'product', id: p.id, title: p.name, url: p.url, source: p.source, media: p.media || '', price: p.price || '', image: p.image || '', date: p.firstSeen || '' });
const favId = (kind, id) => kind + ':' + id;
const isFav = (kind, id) => data.favorites.some((f) => favId(f.kind, f.id) === favId(kind, id));

function findSnapshot(kind, id) {
  const saved = data.favorites.find((f) => favId(f.kind, f.id) === favId(kind, id));
  if (saved) return saved;
  if (kind === 'news') { const n = allNews().find((x) => x.id === id); return n && newsSnapshot(n); }
  const p = data.products.find((x) => x.id === id);
  return p && productSnapshot(p);
}

/** 按星號：先更新畫面，再存到 Apps Script；失敗時還原。 */
function toggleFav(kind, id) {
  const item = findSnapshot(kind, id);
  if (!item) return;
  const on = !isFav(kind, id);
  const prev = data.favorites;
  data.favorites = on ? [Object.assign({ starredAt: new Date().toISOString() }, item)].concat(prev)
    : prev.filter((f) => favId(f.kind, f.id) !== favId(kind, id));
  render();
  google.script.run
    .withSuccessHandler((favs) => { data.favorites = favs; render(); })
    .withFailureHandler((err) => {
      data.favorites = prev; render();
      toast(err && /已滿/.test(err.message) ? '我的最愛已滿' : '儲存失敗，請再試一次');
    })
    .toggleFavorite(item, on);
}

const starButton = (kind, id) => {
  const on = isFav(kind, id);
  return `<button type="button" class="star" data-fav="${kind}" data-id="${esc(id)}" aria-pressed="${on}" aria-label="${on ? '取消收藏' : '加入我的最愛'}">${on ? '★' : '☆'}</button>`;
};

// ---------- 整理資料 ----------

const isPChome = (p) => p.source === 'PChome';

/** 活動&新聞的來源分類：官網 → 官方；其他媒體的商品類報導 → 新聞；活動報導 → 活動。 */
const feedOf = (n) => (n.source === '寶可夢官網' ? '官方' : n.kind === 'product' ? '新聞' : '活動');

/** 所有消息：新聞分頁，加上以前存成商品的寶可夢中心新聞和官網公告（7 天內會自然過期）。 */
function allNews() {
  const legacy = data.products.filter((p) => !isPChome(p)).map((p) => ({
    id: p.id, kind: 'product', title: p.name, url: p.url, source: p.source === '官網' ? '寶可夢官網' : (p.media || p.source),
    others: [], published: null, firstSeen: p.firstSeen,
  }));
  return data.news.concat(legacy).map((n) => Object.assign({}, n, { feed: feedOf(n) }));
}

function derive() {
  const now = Date.now(), s = data.state;
  // 沒有結束時間的活動是 ScrapedDuck 清掉時間的舊活動，不顯示（否則剩餘時間會變成 Infinity）
  const events = data.events.filter((e) => e.end).map((e) => {
    const end = new Date(e.end).getTime();
    const start = e.start ? new Date(e.start).getTime() : null;
    const left = end - now;
    const span = start ? end - start : 0;
    return Object.assign({}, e, {
      ended: left <= 0, left,
      notStarted: start && start > now,
      pct: span ? Math.max(3, Math.min(100, Math.round(left / span * 100))) : 100,
      soon: left > 0 && left < 24 * HOUR && !(start && start > now),
    });
  }).sort((a, b) => a.left - b.left);
  const tasks = data.tasks.map((g) => {
    const end = g.end ? new Date(g.end).getTime() : null;
    const left = end ? end - now : Infinity;
    const items = g.tasks.map((t, i) => {
      const key = taskKey(g, t, i);
      return Object.assign({}, t, { key, index: i, done: isDone(key) });
    });
    const n = items.filter((t) => t.done).length;
    return Object.assign({}, g, {
      items, n, allDone: n === items.length, savedAllDone: items.every((t) => savedDone(t.key)), gaveUp: !!s.gaveUp[g.id], ended: left <= 0, left,
      soon: left > 0 && left < REMIND_MS && n < items.length,
    });
  }).sort((a, b) => a.left - b.left);
  // 同一件商品可能有好幾個 PChome 編號：名稱＋價格相同只顯示第一筆
  const seenProducts = {};
  const products = data.products.filter(isPChome).filter((p) => !seenProducts[productKey(p)] && (seenProducts[productKey(p)] = true));
  const twNews = allNews().sort((a, b) => (b.published || b.firstSeen || '').localeCompare(a.published || a.firstSeen || ''));
  return {
    activeEvents: events.filter((e) => !e.ended),
    endedEvents: events.filter((e) => e.ended),
    // 已儲存為全部完成的任務組排到最後（勾完還沒按儲存時先留在原位）
    activeTasks: tasks.filter((g) => !g.gaveUp && !g.ended).sort((a, b) => a.savedAllDone - b.savedAllDone),
    archivedTasks: tasks.filter((g) => g.gaveUp || g.ended),
    products, twNews,
    isNew: (p) => p.firstSeen && now - new Date(p.firstSeen).getTime() < 24 * HOUR,
  };
}
// ---------- 畫面 ----------

const catOf = (e) => (CATEGORIES.includes(e.category) ? e.category : '其他');
const ts = (iso) => (iso ? new Date(iso).getTime() : Infinity);

function toggleIn(list, value) {
  if (value === '全部') return [];
  return list.includes(value) ? list.filter((x) => x !== value) : list.concat(value);
}

function pillsHtml(options, selected, attr, countOf) {
  return ['全部'].concat(options).map((o) => {
    const on = o === '全部' ? !selected.length : selected.includes(o);
    return `<button type="button" class="pill" aria-pressed="${on}" aria-selected="${on}" data-${attr}="${esc(o)}">${esc(o)}${countOf ? ' ' + countOf(o) : ''}</button>`;
  }).join('');
}

function paginate(list, key) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const page = Math.min(ui.page[key] || 1, pages);
  ui.page[key] = page;
  let pager = '';
  if (pages > 1) {
    const nums = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - page) <= 2) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    pager = `<nav class="pager" aria-label="分頁">
      <button type="button" data-page="${key}:${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="上一頁">‹</button>
      ${nums.map((n) => n === '…' ? '<span class="muted">…</span>' : `<button type="button" data-page="${key}:${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
      <button type="button" data-page="${key}:${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="下一頁">›</button>
      <span class="muted" style="width:100%;text-align:center;font-size:13px">共 ${list.length} 筆，每頁 ${PAGE_SIZE} 筆</span>
    </nav>`;
  }
  return { items: list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), pager };
}

const SORT_KEYS = { type: (e) => CATEGORIES.indexOf(catOf(e)), start: (e) => ts(e.start), end: (e) => ts(e.end) };
function sortEvents(list) {
  const { key, dir } = ui.goSort;
  const order = key ? [key].concat(['type', 'start', 'end'].filter((k) => k !== key)) : ['type', 'start', 'end'];
  return list.slice().sort((a, b) => {
    for (const k of order) {
      const x = SORT_KEYS[k](a), y = SORT_KEYS[k](b);
      if (x !== y) return (x < y ? -1 : 1) * (k === key ? dir : 1);
      if (k === 'type' && a.type !== b.type) return String(a.type).localeCompare(String(b.type)) * (k === key ? dir : 1);
    }
    return 0;
  });
}

function sortButton(key, label) {
  const on = ui.goSort.key === key;
  const arrow = on ? (ui.goSort.dir > 0 ? '▲' : '▼') : '↕';
  return `<button type="button" class="th-sort" data-sort="${key}" aria-pressed="${on}">${label} <span aria-hidden="true">${arrow}</span></button>`;
}

const productKey = (p) => String(p.name || '').split(/\s+/).filter(Boolean).join(' ').toLowerCase() + '|' + (p.price || '');

// 商品名稱搜尋：不分大小寫，忽略前後空白；空字串代表不篩選
const matchesQuery = (name, query) => String(name || '').toLowerCase().includes(String(query || '').trim().toLowerCase());

const priceOf = (p) => { const n = parseInt(String(p.price || '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? null : n; };
function sortProducts(list) {
  const indexed = list.map((p, i) => ({ p, i }));
  const by = {
    new: (a, b) => (b.p.firstSeen || '').localeCompare(a.p.firstSeen || '') || a.i - b.i,
    old: (a, b) => (a.p.firstSeen || '').localeCompare(b.p.firstSeen || '') || b.i - a.i,
    priceDesc: (a, b) => priceCmp(a, b, -1),
    priceAsc: (a, b) => priceCmp(a, b, 1),
  };
  function priceCmp(a, b, dir) {
    const x = priceOf(a.p), y = priceOf(b.p);
    if (x === null || y === null) return (x === null) - (y === null) || a.i - b.i; // 沒有價格的排最後
    return (x - y) * dir || a.i - b.i;
  }
  return indexed.sort(by[ui.shopSort] || by.new).map((x) => x.p);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, label]) =>
    `<button type="button" role="tab" aria-selected="${id === ui.tab}" data-tab="${id}">${label}</button>`).join('');
  // 手機上分頁列可以左右滑：把目前的分頁捲進畫面
  const current = document.querySelector('nav [aria-selected=true]');
  if (current) current.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function eventRows(list) {
  return list.map((e) => `
    <tr>
      <td class="col-name"><a class="link" href="${esc(e.url)}" target="_blank" rel="noopener"><b>${esc(e.name)}</b></a></td>
      <td>${tagHtml(catOf(e))}${e.type && e.type !== catOf(e) ? `<div class="muted" style="font-size:12px;margin-top:2px">${esc(e.type)}</div>` : ''}</td>
      <td class="when">${when(e.start)}</td>
      <td class="when">${when(e.end)}</td>
      <td class="col-left">
        <div class="stack" style="gap:4px">
          <span class="${e.soon ? 'soon' : 'muted'}" style="font-size:13px;font-weight:700">${e.notStarted ? '未開始' : leftText(e.left)}</span>
          <div class="bar ${e.soon ? 'soon' : ''}"><div style="width:${e.pct}%"></div></div>
        </div>
      </td>
    </tr>`).join('');
}

function eventCards(list) {
  return list.map((e) => `
    <div class="card pad stack" style="gap:6px">
        <div class="row" style="gap:8px">${tagHtml(catOf(e))}<span class="${e.soon ? 'soon' : 'muted'}" style="font-size:13px;font-weight:700">${e.notStarted ? '未開始' : '剩 ' + leftText(e.left)}</span></div>
        <b>${esc(e.name)}</b>
        <span class="muted" style="font-size:13px">${when(e.start)} → ${when(e.end)}</span>
        <div class="bar ${e.soon ? 'soon' : ''}"><div style="width:${e.pct}%"></div></div>
    </div>`).join('');
}

// ---------- GO 活動行事曆 ----------

// 台灣時間沒有夏令時間：日期編號 = (時間 + 8 小時) / 一天
const TZ_MS = 8 * HOUR;
const dayNo = (t) => Math.floor((t + TZ_MS) / DAY);
const dayLabel = (n) => { const d = new Date(n * DAY); return { m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay() }; };
const mmdd = (n) => { const x = dayLabel(n); return String(x.m).padStart(2, '0') + '/' + String(x.d).padStart(2, '0'); };
const hhmm = (t) => new Date(t + TZ_MS).toISOString().slice(11, 16);
const WEEKDAYS = '日一二三四五六';
const CAL_COLORS = ['#FFE08A', '#F2B8CE', '#F7BFA6', '#BBD4FA', '#BFE6CA', '#DADDE3'];
const calColor = (e) => CAL_COLORS[Math.max(0, CATEGORIES.indexOf(catOf(e)))] || CAL_COLORS[CAL_COLORS.length - 1];

/** 顯示範圍內的活動，每筆算出第幾天開始、第幾天結束（0 起算）與兩側是否超出。 */
function calLayout(events, first, days) {
  const last = first + days - 1;
  return events.map((e) => {
    const s = e.start ? new Date(e.start).getTime() : null;
    const end = new Date(e.end).getTime();
    const from = s === null ? -Infinity : dayNo(s);
    const to = Math.max(from, dayNo(end - 1)); // 00:00 結束算前一天
    return { e, s, end, from, to };
  }).filter((x) => x.from <= last && x.to >= first)
    .sort((a, b) => (a.s === null ? -Infinity : a.s) - (b.s === null ? -Infinity : b.s) || a.end - b.end)
    .map((x) => Object.assign(x, {
      col: Math.max(x.from, first) - first, span: Math.min(x.to, last) - Math.max(x.from, first) + 1,
      cutL: x.from < first, cutR: x.to > last,
      text: x.from === x.to ? hhmm(x.s) : `${x.s === null ? '未定' : mmdd(x.from)} – ${mmdd(x.to)}`,
    }));
}

function calGrid(events, first, days, today, narrow) {
  const rows = calLayout(events, first, days);
  const head = Array.from({ length: days }, (_, i) => {
    const n = first + i, x = dayLabel(n), isToday = n === today;
    return `<div class="cal-day${x.w === 0 || x.w === 6 ? ' we' : ''}${isToday ? ' today' : ''}" style="grid-column:${i + 2};grid-row:1"><b>${x.d === 1 || i === 0 ? x.m + '/' : ''}${x.d}</b>${isToday ? '今天' : WEEKDAYS[x.w]}</div>`;
  }).join('');
  const per = narrow ? 2 : 1; // 窄螢幕：名稱一行、色條一行
  const total = 1 + rows.length * per;
  const shade = Array.from({ length: days }, (_, i) => {
    const n = first + i, w = dayLabel(n).w;
    const cls = n === today ? 'cal-today' : w === 0 || w === 6 ? 'cal-we' : '';
    return cls ? `<div class="${cls}" style="grid-column:${i + 2};grid-row:1 / span ${total}"></div>` : '';
  }).join('');
  const body = rows.map((r, i) => {
    const row = 2 + i * per;
    const name = `<div class="cal-name" style="grid-column:${narrow ? '2 / -1' : 1};grid-row:${row}"><i class="cal-dot" style="background:${calColor(r.e)}"></i><span>${esc(r.e.name)}</span></div>`;
    const bar = `<a class="cal-bar${r.cutL ? ' cut-l' : ''}${r.cutR ? ' cut-r' : ''}${r.span === 1 ? ' one' : ''}" href="${esc(r.e.url)}" target="_blank" rel="noopener" title="${esc(r.e.name)}" data-cal="${esc(r.e.id)}" style="grid-column:${r.col + 2} / span ${r.span};grid-row:${row + per - 1};background:${calColor(r.e)}">${r.cutL ? '‹ ' : ''}${esc(r.text)}${r.cutR ? ' ›' : ''}</a>`;
    return name + bar;
  }).join('');
  return rows.length
    ? `<div class="cal ${narrow ? 'cal-narrow' : ''}" style="grid-template-columns:${narrow ? '0' : '210px'} repeat(${days}, minmax(0, 1fr))">${shade}${head}${body}</div>`
    : '<p class="muted">這段期間沒有活動</p>';
}

function calendarHtml(events) {
  const today = dayNo(Date.now());
  // 寬螢幕從本週一開始看兩週；窄螢幕從今天開始看一週
  const monday = today - ((dayLabel(today).w + 6) % 7) + ui.calWeek * 7;
  const start = today + ui.calWeek * 7;
  const range = (first, days) => `${mmdd(first)} – ${mmdd(first + days - 1)}`;
  const legend = CATEGORIES.map((c, i) => `<span class="row" style="gap:6px"><i class="cal-dot" style="background:${CAL_COLORS[i] || CAL_COLORS[CAL_COLORS.length - 1]}"></i>${esc(c)}</span>`).join('');
  return `
    <section class="card pad stack" style="gap:14px" aria-label="行事曆">
      <div class="toolbar">
        <h3>行事曆</h3>
        ${ui.calOpen ? `<span class="muted only-wide">${range(monday, 14)}</span><span class="muted only-narrow">${range(start, 7)}</span>` : ''}
        <span class="grow" style="flex-basis:0"></span>
        <div class="toolbar">
          ${ui.calOpen ? `
            <button type="button" class="pill" data-calmove="-1" aria-label="上一週">‹</button>
            <button type="button" class="pill" data-calmove="0">今天</button>
            <button type="button" class="pill" data-calmove="1" aria-label="下一週">›</button>` : ''}
          <button type="button" class="ghost" data-caltoggle="1" aria-expanded="${ui.calOpen}">${ui.calOpen ? '收合' : '展開'}</button>
        </div>
      </div>
      ${ui.calOpen ? `
        <div class="only-wide stack">${calGrid(events, monday, 14, today, false)}</div>
        <div class="only-narrow stack">${calGrid(events, start, 7, today, true)}</div>
        <div class="row cal-legend">${legend}<span style="margin-left:auto">‹ › 表示活動超出顯示範圍</span></div>` : ''}
    </section>`;
}

function taskGroupHtml(g) {
  const pct = Math.round(g.n / g.items.length * 100);
  // 已完成的任務組預設收合，只留標題列
  const folded = g.savedAllDone && !ui.taskOpen[g.id];
  const foldButton = g.savedAllDone
    ? `<button type="button" class="ghost" data-taskopen="${esc(g.id)}" aria-expanded="${!folded}">${folded ? '展開' : '收合'}</button>` : '';
  if (folded) {
    return `
    <div class="card pad row group-head done-group">
      <div class="grow stack" style="gap:0">
        <a class="link" href="${esc(g.url)}" target="_blank" rel="noopener"><b style="font-size:16px">${esc(g.name)}</b></a>
        <span class="muted" style="font-size:13px">${when(g.end)} 結束 · ${g.items.length} 項全部完成</span>
      </div>
      <b style="font-size:14px;color:var(--blue)">全部完成</b>
      ${foldButton}
    </div>`;
  }
  return `
    <div class="card pad stack" style="gap:10px">
      <div class="row group-head">
        <div class="grow stack" style="gap:0">
          <a class="link" href="${esc(g.url)}" target="_blank" rel="noopener"><b style="font-size:16px">${esc(g.name)}</b></a>
          <span class="muted" style="font-size:13px">${when(g.start)} 開始 → ${when(g.end)} 結束${g.end ? ` · <b class="${g.soon ? 'soon' : ''}">剩 ${leftText(g.left)}</b>` : ''}</span>
        </div>
        <b style="font-size:14px;color:var(--blue)">${g.allDone ? '全部完成' : `${g.n}/${g.items.length} 完成`}</b>
        ${foldButton || `<button type="button" class="ghost" data-flag="gaveUp" data-id="${esc(g.id)}" data-value="1">放棄</button>`}
      </div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      ${g.items.map((t) => `
        <label class="task ${t.done ? 'checked' : ''}">
          <input type="checkbox" data-task="${esc(g.id)}" data-index="${t.index}" ${t.done ? 'checked' : ''}>
          <span class="body">
            <span class="text">${esc(t.text)}</span>
            <span class="reward">${t.reward ? esc(t.reward) : `<a href="${esc(g.url)}" target="_blank" rel="noopener">見原文</a>`}</span>
          </span>
        </label>`).join('')}
    </div>`;
}

function productCard(p, isNew, gone) {
  const img = p.image ? ` style="background-image:url('${esc(p.image)}')"` : '';
  return `
    <div class="product-wrap">
      <a class="card product" href="${esc(p.url)}" target="_blank" rel="noopener">
        <div class="img"${img}>${p.image ? '' : esc(p.source)}${isNew ? '<span class="new">NEW</span>' : ''}</div>
        <div class="info">
          <span class="muted" style="font-size:12px">${esc(p.media ? p.source + ' · ' + p.media : p.source)} · ${when(p.firstSeen).slice(0, 5)}${gone ? ' · 已下架' : ''}</span>
          <span class="name">${esc(p.name)}</span>
          <span class="price">${esc(p.price || '看消息')}</span>
        </div>
      </a>
      ${starButton('product', p.id)}
    </div>`;
}

function newsItem(n, gone) {
  const d = new Date(n.published || n.firstSeen);
  const parts = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: '2-digit' }).formatToParts(d);
  const m = parts.find((x) => x.type === 'month').value, day = parts.find((x) => x.type === 'day').value;
  const others = n.others && n.others.length ? ` · 另有 ${n.others.length} 家報導` : '';
  return `
    <div class="card pad row news-item">
      <a class="row link grow" href="${esc(n.url)}" target="_blank" rel="noopener" style="flex-wrap:nowrap">
        <div class="date"><span>${m} 月</span><b>${day}</b></div>
        <div class="grow stack" style="gap:2px"><b>${esc(n.title)}</b><span class="muted" style="font-size:13px">${esc(n.source)}${others}${gone ? ' · 已下架' : ''}</span></div>
      </a>
      ${starButton('news', n.id)}
    </div>`;
}

function renderOverview(d) {
  const soonEvents = d.activeEvents.filter((e) => e.soon);
  // 「快結束了」：沒做完、在 overviewTaskHours（預設 48 小時）內結束的任務組
  const soonTasks = d.activeTasks.filter((g) => g.n < g.items.length && g.left < CONFIG.overviewTaskHours * HOUR);
  const allItems = d.activeTasks.flatMap((g) => g.items);
  const fresh = d.products.filter(d.isNew);
  return `
    <div class="stats">
      <div class="card stat"><span class="muted">進行中活動</span><b>${d.activeEvents.filter((e) => !e.notStarted).length}</b></div>
      <div class="card stat"><span class="muted">24 小時內結束</span><b class="soon">${soonEvents.length}</b></div>
      <div class="card stat"><span class="muted">任務進度</span><b style="color:var(--blue)">${allItems.filter((t) => t.done).length}/${allItems.length}</b></div>
      <div class="card stat"><span class="muted">今天新商品</span><b>${fresh.length}</b></div>
    </div>
    <section class="card pad stack">
      <h3>快結束了，還沒完成</h3>
      ${soonTasks.map((g) => `<div class="row"><span class="tag">任務</span><b class="grow">${esc(g.name)}</b><b class="soon" style="font-size:14px">剩 ${leftText(g.left)} · ${g.items.length - g.n} 項未完成</b></div>`).join('')}
      ${soonEvents.map((e) => `<div class="row">${tagHtml(catOf(e))}<b class="grow">${esc(e.name)}</b><b class="soon" style="font-size:14px">剩 ${leftText(e.left)}</b></div>`).join('')}
      ${soonTasks.length + soonEvents.length ? '' : '<span class="muted">沒有快結束的項目</span>'}
    </section>
    <section class="stack"><h3>今天新上架</h3>
      ${fresh.length ? `<div class="grid">${fresh.slice(0, 8).map((p) => productCard(p, true)).join('')}</div>` : '<span class="muted">今天沒有新商品</span>'}
      ${fresh.length > 8 ? `<button type="button" class="outline" data-tab="shop" style="align-self:flex-start">看全部 ${fresh.length} 件</button>` : ''}
    </section>`;
}

function renderGo(d) {
  const sel = ui.goCats;
  const filtered = sel.length ? d.activeEvents.filter((e) => sel.includes(catOf(e))) : d.activeEvents;
  const { items, pager } = paginate(sortEvents(filtered), 'go');
  const count = (c) => c === '全部' ? d.activeEvents.length : d.activeEvents.filter((e) => catOf(e) === c).length;
  return `
    <div class="head"><h2>Pokémon GO 活動</h2><span class="muted">分類可以多選；活動結束後會自動移到封存</span></div>
    <div class="pills" aria-label="活動分類">${pillsHtml(CATEGORIES, sel, 'gocat', count)}</div>
    ${calendarHtml(filtered)}
    <div class="toolbar only-narrow"><span class="muted">排序</span>${sortButton('type', '類型')}${sortButton('start', '開始')}${sortButton('end', '結束')}</div>
    ${items.length ? `
      <div class="card scroll only-wide"><table>
        <thead><tr><th class="col-name">活動</th><th>${sortButton('type', '類型')}</th><th>${sortButton('start', '開始')}</th><th>${sortButton('end', '結束')}</th><th class="col-left">剩餘</th></tr></thead>
        <tbody>${eventRows(items)}</tbody></table></div>
      <div class="only-narrow stack" style="gap:10px">${eventCards(items)}</div>
      ${pager}` : '<p class="muted">沒有符合的活動</p>'}`;
}

function renderTasks(d) {
  const { items, pager } = paginate(d.activeTasks, 'tasks');
  return `
    <div class="head"><h2>任務待辦</h2><span class="muted">田野調查和活動限時調查來自 LeekDuck，另外會讀巴哈姆特 Pokémon GO 哈啦板的情報；結束前 ${REMIND_MS / HOUR} 小時還沒完成會發 Discord 提醒</span></div>
    ${(items.map((g, i) => (g.savedAllDone && !(items[i - 1] || {}).savedAllDone ? `<h3 class="muted" style="margin-top:8px">已完成 ${d.activeTasks.filter((x) => x.savedAllDone).length} 組</h3>` : '') + taskGroupHtml(g)).join('') || '<p class="muted">目前沒有任務</p>') + pager}`;
}

function renderShop(d) {
  const filtered = d.products.filter((p) => matchesQuery(p.name, ui.shopQuery));
  const { items, pager } = paginate(sortProducts(filtered), 'shop');
  const query = ui.shopQuery.trim();
  const empty = query ? `找不到符合「${esc(query)}」的商品` : '沒有商品';
  const sorts = [['new', '上架時間：新到舊'], ['old', '上架時間：舊到新'], ['priceDesc', '價格：高到低'], ['priceAsc', '價格：低到高']];
  return `
    <div class="head"><h2>新商品</h2><span class="muted">最近 ${CONFIG.keepProductDays} 天新上架，超過 ${CONFIG.keepProductDays} 天自動移除</span></div>
    <div class="toolbar">
      <input type="search" class="search" data-shopquery placeholder="搜尋商品名稱" aria-label="搜尋商品名稱" value="${esc(ui.shopQuery)}">
      <label class="muted" style="display:flex;gap:8px;align-items:center">排序
        <select data-shopsort>${sorts.map(([v, l]) => `<option value="${v}" ${v === ui.shopSort ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </label>
    </div>
    ${items.length ? `<div class="grid">${items.map((p) => productCard(p, d.isNew(p))).join('')}</div>${pager}` : `<p class="muted">${empty}</p>`}`;
}

function renderTw(d) {
  const sel = ui.feeds;
  const filtered = sel.length ? d.twNews.filter((n) => sel.includes(n.feed)) : d.twNews;
  const { items, pager } = paginate(filtered, 'tw');
  const count = (c) => c === '全部' ? d.twNews.length : d.twNews.filter((n) => n.feed === c).length;
  return `
    <div class="head"><h2>活動&amp;新聞</h2><span class="muted">最近 ${CONFIG.keepNewsDays} 天的官網公告、活動和新聞，同一件事只列一次；來源可以多選</span></div>
    <div class="pills" aria-label="來源">${pillsHtml(FEEDS, sel, 'feed', count)}</div>
    ${(items.map((n) => newsItem(n)).join('') || '<p class="muted">沒有符合的消息</p>') + pager}`;
}

function renderFav(d) {
  // 收藏時間新到舊
  const favs = data.favorites.slice().sort((a, b) => String(b.starredAt).localeCompare(String(a.starredAt)));
  const newsIds = {}, productIds = {};
  d.twNews.forEach((n) => { newsIds[n.id] = true; });
  d.products.forEach((p) => { productIds[p.id] = true; });
  // 快照轉回新聞／商品的欄位，沿用同樣的卡片
  const news = favs.filter((f) => f.kind === 'news')
    .map((f) => ({ id: f.id, title: f.title, url: f.url, source: f.source, others: [], published: f.date, gone: !newsIds[f.id] }));
  const products = favs.filter((f) => f.kind === 'product')
    .map((f) => ({ id: f.id, name: f.title, url: f.url, source: f.source, media: f.media, price: f.price, image: f.image, firstSeen: f.date, gone: !productIds[f.id] }));
  if (!news.length && !products.length) {
    return `<div class="head"><h2>我的最愛</h2></div><p class="muted">還沒有收藏，按 ☆ 加入</p>`;
  }
  const n = paginate(news, 'favNews'), p = paginate(products, 'favProducts');
  return `
    <div class="head"><h2>我的最愛</h2><span class="muted">按 ★ 取消收藏；原本的新聞或商品被移除後仍會保留在這裡</span></div>
    <section class="stack"><h3>活動&amp;新聞</h3>
      ${news.length ? n.items.map((x) => newsItem(x, x.gone)).join('') + n.pager : '<span class="muted">還沒有收藏的新聞</span>'}
    </section>
    <section class="stack"><h3>商品</h3>
      ${products.length ? `<div class="grid">${p.items.map((x) => productCard(x, false, x.gone)).join('')}</div>${p.pager}` : '<span class="muted">還沒有收藏的商品</span>'}
    </section>`;
}

function renderArchive(d) {
  const list = d.archivedTasks.map((g) => ({
    tag: '<span class="tag">任務</span>', name: g.name,
    reason: g.gaveUp ? '已放棄 · 不再提醒' : `已結束 · ${when(g.end)}`,
    restore: g.gaveUp && !g.ended ? `data-flag="gaveUp" data-id="${esc(g.id)}" data-value=""` : '',
  })).concat(d.endedEvents.map((e) => ({
    tag: tagHtml(catOf(e)), name: e.name, reason: `已結束 · ${when(e.end)}`, restore: '',
  })));
  const { items, pager } = paginate(list, 'archive');
  const rows = items.map((a) => `
    <div class="card pad row">${a.tag}
      <div class="grow stack" style="gap:0"><b>${esc(a.name)}</b><span class="muted" style="font-size:13px">${a.reason}</span></div>
      ${a.restore ? `<button type="button" class="outline" ${a.restore}>復原</button>` : ''}
    </div>`).join('');
  return `
    <div class="head"><h2>封存</h2><span class="muted">已結束的活動，以及已放棄或已結束的任務；放棄按錯了可以按「復原」</span></div>
    ${rows + pager || '<p class="muted">封存是空的</p>'}`;
}

const RENDERERS = {
  overview: renderOverview, go: renderGo, tasks: renderTasks, shop: renderShop, tw: renderTw, fav: renderFav, archive: renderArchive,
};

function render() {
  renderTabs();
  renderSaveBar();
  document.getElementById('main').innerHTML = (RENDERERS[ui.tab] || renderOverview)(derive());
}

// ---------- 事件 ----------

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-taskopen],[data-gocat],[data-calmove],[data-caltoggle],[data-feed],[data-sort],[data-page],button[data-flag],button[data-save],button[data-fav]');
  if (!t || t.disabled) return;
  const ds = t.dataset;
  if ('save' in ds) { saveDraft(); return; }
  if (ds.fav) { toggleFav(ds.fav, ds.id); return; }
  if (ds.tab) { ui.tab = ds.tab; try { localStorage.setItem('tab', ui.tab); } catch (e) {} window.scrollTo(0, 0); }
  else if (ds.taskopen) { ui.taskOpen[ds.taskopen] = !ui.taskOpen[ds.taskopen]; }
  else if (ds.calmove) { ui.calWeek = +ds.calmove ? ui.calWeek + +ds.calmove : 0; }
  else if (ds.caltoggle) { ui.calOpen = !ui.calOpen; try { localStorage.setItem('calOpen', ui.calOpen ? '1' : '0'); } catch (e) {} }
  else if (ds.gocat) { ui.goCats = toggleIn(ui.goCats, ds.gocat); ui.page.go = 1; }
  else if (ds.feed) { ui.feeds = toggleIn(ui.feeds, ds.feed); ui.page.tw = 1; }
  else if (ds.sort) {
    ui.goSort = ui.goSort.key === ds.sort ? { key: ds.sort, dir: -ui.goSort.dir } : { key: ds.sort, dir: 1 };
    ui.page.go = 1;
  }
  else if (ds.page) { const [k, n] = ds.page.split(':'); ui.page[k] = +n; window.scrollTo(0, 0); }
  else { setFlag(ds.flag, ds.id, !!ds.value); return; }
  render();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.matches('input[data-task]')) toggleTask(t.dataset.task, +t.dataset.index, t.checked);
  if (t.matches('select[data-shopsort]')) { ui.shopSort = t.value; ui.page.shop = 1; render(); }
});
// 有沒儲存的勾選時，離開或重新整理頁面先確認
window.addEventListener('beforeunload', (ev) => {
  if (!draftCount()) return;
  ev.preventDefault();
  ev.returnValue = '';
});
// 搜尋框：每打一個字就重畫列表，重畫後把焦點和游標放回搜尋框
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (!t.matches('input[data-shopquery]')) return;
  const caret = t.selectionStart;
  ui.shopQuery = t.value; ui.page.shop = 1;
  render();
  const box = document.querySelector('input[data-shopquery]');
  if (box) { box.focus(); box.setSelectionRange(caret, caret); }
});

google.script.run
  .withSuccessHandler((result) => {
    data = result;
    CONFIG = data.config;
    CATEGORIES = CONFIG.categories.map((c) => c.name);
    REMIND_MS = CONFIG.remindHours * HOUR;
    document.getElementById('updated').textContent = data.updatedAt ? `最後更新 ${when(data.updatedAt)}` : '還沒有資料，等每日排程跑過一次';
    render();
  })
  .withFailureHandler((err) => {
    document.getElementById('main').innerHTML = `<div class="notice">載入失敗：${esc(err.message)}</div>`;
  })
  .getData();
</script>
