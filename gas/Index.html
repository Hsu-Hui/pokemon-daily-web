<!doctype html>
<html lang="zh-Hant-TW">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --sunk: #ECEEF2; --line: #E1E4EA;
  --ink: #1B1D22; --muted: #5C6370; --red: #CC2E0B; --blue: #1F5FC4;
  --active-bg: #1B1D22; --active-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161A; --surface: #1E2127; --sunk: #2A2E36; --line: #343944;
    --ink: #F1F2F4; --muted: #A3A9B5; --red: #FF7A5C; --blue: #7EB0FF;
    --active-bg: #F1F2F4; --active-ink: #14161A;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
a { color: var(--blue); }
button { font: inherit; cursor: pointer; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: #CC2E0B; margin: 0; cursor: pointer; flex: none; }

header { background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.brand { display: flex; align-items: center; gap: 12px; padding-top: 18px; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .02em; }
.brand small { display: block; font-size: 13px; color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 14px; }
nav button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px 12px 0 0; font-weight: 700; background: transparent; color: var(--muted); }
nav button[aria-selected=true] { background: var(--bg); color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
main.wrap { padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }

h2 { margin: 0; font-size: 20px; font-weight: 900; }
h3 { margin: 0; font-size: 17px; font-weight: 700; }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 200px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; }
.stat b { display: block; font-size: 30px; font-weight: 900; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.pill[aria-selected=true] { border-color: var(--active-bg); background: var(--active-bg); color: var(--active-ink); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--sunk); color: var(--ink); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); }
.bar > div { height: 6px; border-radius: 3px; background: var(--blue); }
.soon { color: var(--red) !important; }
.bar.soon > div { background: var(--red); }
.done { opacity: .55; }

table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 12px 8px; }
td { padding: 12px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 16px; width: 56px; }
.scroll { overflow-x: auto; }
.when { font-size: 14px; white-space: nowrap; }
.th-sort { border: 0; background: transparent; padding: 0; color: inherit; font: inherit; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; min-height: 32px; }
.th-sort[aria-pressed=true] { color: var(--ink); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { font: inherit; font-size: 14px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.pager { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; padding-top: 4px; }
.pager button { min-width: 40px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; }
.pager button[aria-current=page] { background: var(--active-bg); border-color: var(--active-bg); color: var(--active-ink); }
.pager button:disabled { opacity: .4; cursor: default; }
.only-narrow { display: none; }
@media (max-width: 680px) {
  .only-wide { display: none; } .only-narrow { display: flex; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .product .img { height: 120px; }
}

.task { display: flex; gap: 12px; align-items: center; padding: 6px 0; min-height: 32px; }
.task .reward { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
.task.checked .text { text-decoration: line-through; color: var(--muted); }
.ghost { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; }
.outline { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.product { overflow: hidden; display: flex; flex-direction: column; color: inherit; text-decoration: none; }
.product .img { height: 150px; background: var(--sunk) center / contain no-repeat; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
.product .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.product .name { font-weight: 700; font-size: 14px; }
.price { font-weight: 700; color: var(--red); }
.new { position: absolute; top: 8px; left: 8px; background: #FFCB05; color: #1B1D22; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }
.date { min-width: 64px; display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--sunk); }
.date b { font-size: 22px; font-weight: 900; line-height: 1.1; }
.date span { font-size: 12px; color: var(--muted); }
.link { color: inherit; text-decoration: none; }
.notice { padding: 10px 14px; border-radius: 12px; background: #FDEBD3; color: #7A4200; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--active-bg); color: var(--active-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; display: none; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#FFFFFF" stroke="#1B1D22" stroke-width="2.5"></circle><path d="M2 17a15 15 0 0 1 30 0z" fill="#CC2E0B" stroke="#1B1D22" stroke-width="2.5"></path><circle cx="17" cy="17" r="4.5" fill="#FFFFFF" stroke="#1B1D22" stroke-width="2.5"></circle></svg>
      <div><h1>寶可夢每日看板</h1><small id="updated">載入中…</small></div>
    </div>
    <nav id="tabs" role="tablist" aria-label="分頁"></nav>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">載入中…</p></main>
<div class="toast" id="toast" role="status"></div>

<script>
const TABS = [['overview', '總覽'], ['go', 'GO 活動'], ['tasks', '任務待辦'], ['shop', '新商品'], ['tw', '台灣活動'], ['archive', '封存']];
const TYPE_COLORS = {
  '社群日': ['#DDF3E4', '#155B30'], '社群日經典': ['#DDF3E4', '#155B30'],
  '團體戰': ['#ECE3FA', '#4B2A85'], '團體戰日': ['#ECE3FA', '#4B2A85'], '團體戰時間': ['#ECE3FA', '#4B2A85'],
  '極巨對戰': ['#ECE3FA', '#4B2A85'], '極巨星期一': ['#ECE3FA', '#4B2A85'],
  '聚焦時刻': ['#FDEBD3', '#7A4200'], '活動': ['#DCEAFE', '#163F7A'], '調查': ['#E6E8EC', '#30353F'],
};
const DAY = 864e5, HOUR = 36e5, REMIND_MS = 4 * HOUR;
const CATEGORIES = ['聚焦時刻', '極巨化/超極巨化', '團體戰/超級團體戰', 'GO Pass', '限時調查', '其他'];
const SOURCES = ['PChome', '寶可夢中心', '官網'];
const PAGE_SIZE = 25;
// goCats、srcs 是多選，空陣列代表「全部」；goSort.key 為 null 時用預設排序（類型 → 開始 → 結束）
const ui = { tab: 'overview', goCats: [], srcs: [], goSort: { key: null, dir: 1 }, shopSort: 'new', page: {} };
let data = null;
try { ui.tab = localStorage.getItem('tab') || 'overview'; } catch (e) {}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const when = (iso) => iso ? fmt.format(new Date(iso)) : '未定';
const leftText = (ms) => ms <= 0 ? '已結束' : ms < 48 * HOUR ? `${Math.max(1, Math.floor(ms / HOUR))} 小時` : `${Math.floor(ms / DAY)} 天`;
const tagHtml = (type) => {
  const c = TYPE_COLORS[type];
  return `<span class="tag"${c ? ` style="background:${c[0]};color:${c[1]}"` : ''}>${esc(type)}</span>`;
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function setFlag(kind, id, value) {
  const prev = !!data.state[kind][id];
  if (value) data.state[kind][id] = true; else delete data.state[kind][id];
  render();
  google.script.run
    .withSuccessHandler((state) => { data.state = state; render(); })
    .withFailureHandler(() => {
      if (prev) data.state[kind][id] = true; else delete data.state[kind][id];
      render(); toast('儲存失敗，請再試一次');
    })
    .setFlag(kind, id, value);
}

// ---------- 整理資料 ----------

function derive() {
  const now = Date.now(), s = data.state;
  const events = data.events.map((e) => {
    const end = e.end ? new Date(e.end).getTime() : null;
    const start = e.start ? new Date(e.start).getTime() : null;
    const left = end ? end - now : Infinity;
    const span = end && start ? end - start : 0;
    return Object.assign({}, e, {
      done: !!s.done[e.id], ended: left <= 0, left,
      notStarted: start && start > now,
      pct: span ? Math.max(3, Math.min(100, Math.round(left / span * 100))) : 100,
      soon: left > 0 && left < 24 * HOUR && !(start && start > now),
    });
  }).sort((a, b) => a.left - b.left);
  const tasks = data.tasks.map((g) => {
    const end = g.end ? new Date(g.end).getTime() : null;
    const left = end ? end - now : Infinity;
    const items = g.tasks.map((t, i) => {
      const key = g.id + '#' + (t.id || i);
      return Object.assign({}, t, { key, done: !!s.taskDone[key] });
    });
    const n = items.filter((t) => t.done).length;
    return Object.assign({}, g, {
      items, n, allDone: n === items.length, gaveUp: !!s.gaveUp[g.id], ended: left <= 0, left,
      soon: left > 0 && left < REMIND_MS && n < items.length,
    });
  }).sort((a, b) => a.left - b.left);
  const shopNews = data.news.filter((n) => n.kind === 'product').map((n) => ({
    id: n.id, source: n.source === '寶可夢官網' ? '官網' : '寶可夢中心', name: n.title, url: n.url,
    price: '看消息', image: '', firstSeen: n.firstSeen, media: n.source,
  }));
  const products = data.products.concat(shopNews);
  const twNews = data.news.filter((n) => n.kind === 'event').sort((a, b) => (b.published || b.firstSeen || '').localeCompare(a.published || a.firstSeen || ''));
  return {
    activeEvents: events.filter((e) => !e.done && !e.ended),
    doneEvents: events.filter((e) => e.done || e.ended),
    activeTasks: tasks.filter((g) => !g.gaveUp && !g.ended),
    archivedTasks: tasks.filter((g) => g.gaveUp || g.ended),
    products, twNews,
    isNew: (p) => p.firstSeen && now - new Date(p.firstSeen).getTime() < 24 * HOUR,
  };
}
// ---------- 畫面 ----------

const catOf = (e) => (CATEGORIES.includes(e.category) ? e.category : '其他');
const ts = (iso) => (iso ? new Date(iso).getTime() : Infinity);

function toggleIn(list, value) {
  if (value === '全部') return [];
  return list.includes(value) ? list.filter((x) => x !== value) : list.concat(value);
}

function pillsHtml(options, selected, attr, countOf) {
  return ['全部'].concat(options).map((o) => {
    const on = o === '全部' ? !selected.length : selected.includes(o);
    return `<button type="button" class="pill" aria-pressed="${on}" aria-selected="${on}" data-${attr}="${esc(o)}">${esc(o)}${countOf ? ' ' + countOf(o) : ''}</button>`;
  }).join('');
}

function paginate(list, key) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const page = Math.min(ui.page[key] || 1, pages);
  ui.page[key] = page;
  let pager = '';
  if (pages > 1) {
    const nums = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - page) <= 2) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    pager = `<nav class="pager" aria-label="分頁">
      <button type="button" data-page="${key}:${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="上一頁">‹</button>
      ${nums.map((n) => n === '…' ? '<span class="muted">…</span>' : `<button type="button" data-page="${key}:${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
      <button type="button" data-page="${key}:${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="下一頁">›</button>
      <span class="muted" style="width:100%;text-align:center;font-size:13px">共 ${list.length} 筆，每頁 ${PAGE_SIZE} 筆</span>
    </nav>`;
  }
  return { items: list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), pager };
}

const SORT_KEYS = { type: (e) => CATEGORIES.indexOf(catOf(e)), start: (e) => ts(e.start), end: (e) => ts(e.end) };
function sortEvents(list) {
  const { key, dir } = ui.goSort;
  const order = key ? [key].concat(['type', 'start', 'end'].filter((k) => k !== key)) : ['type', 'start', 'end'];
  return list.slice().sort((a, b) => {
    for (const k of order) {
      const x = SORT_KEYS[k](a), y = SORT_KEYS[k](b);
      if (x !== y) return (x < y ? -1 : 1) * (k === key ? dir : 1);
      if (k === 'type' && a.type !== b.type) return String(a.type).localeCompare(String(b.type)) * (k === key ? dir : 1);
    }
    return 0;
  });
}

function sortButton(key, label) {
  const on = ui.goSort.key === key;
  const arrow = on ? (ui.goSort.dir > 0 ? '▲' : '▼') : '↕';
  return `<button type="button" class="th-sort" data-sort="${key}" aria-pressed="${on}">${label} <span aria-hidden="true">${arrow}</span></button>`;
}

const priceOf = (p) => { const n = parseInt(String(p.price || '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? null : n; };
function sortProducts(list) {
  const indexed = list.map((p, i) => ({ p, i }));
  const by = {
    new: (a, b) => (b.p.firstSeen || '').localeCompare(a.p.firstSeen || '') || a.i - b.i,
    old: (a, b) => (a.p.firstSeen || '').localeCompare(b.p.firstSeen || '') || b.i - a.i,
    priceDesc: (a, b) => priceCmp(a, b, -1),
    priceAsc: (a, b) => priceCmp(a, b, 1),
  };
  function priceCmp(a, b, dir) {
    const x = priceOf(a.p), y = priceOf(b.p);
    if (x === null || y === null) return (x === null) - (y === null) || a.i - b.i; // 沒有價格的排最後
    return (x - y) * dir || a.i - b.i;
  }
  return indexed.sort(by[ui.shopSort] || by.new).map((x) => x.p);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, label]) =>
    `<button type="button" role="tab" aria-selected="${id === ui.tab}" data-tab="${id}">${label}</button>`).join('');
}

function eventRows(list) {
  return list.map((e) => `
    <tr class="${e.done ? 'done' : ''}">
      <td><input type="checkbox" data-flag="done" data-id="${esc(e.id)}" ${e.done ? 'checked' : ''} aria-label="標記完成"></td>
      <td><a class="link" href="${esc(e.url)}" target="_blank" rel="noopener"><b>${esc(e.name)}</b></a></td>
      <td>${tagHtml(catOf(e))}${e.type && e.type !== catOf(e) ? `<div class="muted" style="font-size:12px;margin-top:2px">${esc(e.type)}</div>` : ''}</td>
      <td class="when">${when(e.start)}</td>
      <td class="when">${when(e.end)}</td>
      <td style="width:180px;padding-right:16px">
        <div class="stack" style="gap:4px">
          <span class="${e.soon ? 'soon' : 'muted'}" style="font-size:13px;font-weight:700">${e.notStarted ? '未開始' : leftText(e.left)}</span>
          <div class="bar ${e.soon ? 'soon' : ''}"><div style="width:${e.pct}%"></div></div>
        </div>
      </td>
    </tr>`).join('');
}

function eventCards(list) {
  return list.map((e) => `
    <label class="card pad row ${e.done ? 'done' : ''}" style="align-items:flex-start;flex-wrap:nowrap">
      <input type="checkbox" data-flag="done" data-id="${esc(e.id)}" ${e.done ? 'checked' : ''} style="margin-top:2px">
      <div class="stack grow" style="gap:6px">
        <div class="row" style="gap:8px">${tagHtml(catOf(e))}<span class="${e.soon ? 'soon' : 'muted'}" style="font-size:13px;font-weight:700">${e.notStarted ? '未開始' : '剩 ' + leftText(e.left)}</span></div>
        <b>${esc(e.name)}</b>
        <span class="muted" style="font-size:13px">${when(e.start)} → ${when(e.end)}</span>
        <div class="bar ${e.soon ? 'soon' : ''}"><div style="width:${e.pct}%"></div></div>
      </div>
    </label>`).join('');
}

function taskGroupHtml(g) {
  const pct = Math.round(g.n / g.items.length * 100);
  return `
    <div class="card pad stack" style="gap:10px">
      <div class="row">
        <div class="grow stack" style="gap:0">
          <a class="link" href="${esc(g.url)}" target="_blank" rel="noopener"><b style="font-size:16px">${esc(g.name)}</b></a>
          <span class="muted" style="font-size:13px">${when(g.start)} 開始 → ${when(g.end)} 結束${g.end ? ` · <b class="${g.soon ? 'soon' : ''}">剩 ${leftText(g.left)}</b>` : ''}</span>
        </div>
        <b style="font-size:14px;color:var(--blue)">${g.allDone ? '全部完成' : `${g.n}/${g.items.length} 完成`}</b>
        <button type="button" class="ghost" data-flag="gaveUp" data-id="${esc(g.id)}" data-value="1">放棄</button>
      </div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      ${g.items.map((t) => `
        <label class="task ${t.done ? 'checked' : ''}">
          <input type="checkbox" data-flag="taskDone" data-id="${esc(t.key)}" ${t.done ? 'checked' : ''}>
          <span class="text">${esc(t.text)}</span>
          <span class="reward">${t.reward ? esc(t.reward) : `<a href="${esc(g.url)}" target="_blank" rel="noopener">見原文</a>`}</span>
        </label>`).join('')}
    </div>`;
}

function productCard(p, isNew) {
  const img = p.image ? ` style="background-image:url('${esc(p.image)}')"` : '';
  return `
    <a class="card product" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="img"${img}>${p.image ? '' : esc(p.source)}${isNew ? '<span class="new">NEW</span>' : ''}</div>
      <div class="info">
        <span class="muted" style="font-size:12px">${esc(p.media ? p.source + ' · ' + p.media : p.source)} · ${when(p.firstSeen).slice(0, 5)}</span>
        <span class="name">${esc(p.name)}</span>
        ${p.price ? `<span class="price">${esc(p.price)}</span>` : ''}
      </div>
    </a>`;
}

function newsItem(n) {
  const d = new Date(n.published || n.firstSeen);
  const parts = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: '2-digit' }).formatToParts(d);
  const m = parts.find((x) => x.type === 'month').value, day = parts.find((x) => x.type === 'day').value;
  const others = n.others && n.others.length ? ` · 另有 ${n.others.length} 家報導` : '';
  return `
    <a class="card pad row link" href="${esc(n.url)}" target="_blank" rel="noopener">
      <div class="date"><span>${m} 月</span><b>${day}</b></div>
      <div class="grow stack" style="gap:2px"><b>${esc(n.title)}</b><span class="muted" style="font-size:13px">${esc(n.source)}${others}</span></div>
    </a>`;
}

function render() {
  renderTabs();
  const d = derive();
  const main = document.getElementById('main');
  const errors = data.errors ? `<div class="notice">今天這些來源抓取失敗：${esc(data.errors)}</div>` : '';
  let html = '';

  if (ui.tab === 'overview') {
    const soonEvents = d.activeEvents.filter((e) => e.soon);
    const soonTasks = d.activeTasks.filter((g) => g.soon);
    const allItems = d.activeTasks.flatMap((g) => g.items);
    const fresh = d.products.filter(d.isNew);
    html = `${errors}
      <div class="stats">
        <div class="card stat"><span class="muted">未完成活動</span><b>${d.activeEvents.filter((e) => !e.notStarted).length}</b></div>
        <div class="card stat"><span class="muted">24 小時內結束</span><b class="soon">${soonEvents.length}</b></div>
        <div class="card stat"><span class="muted">任務進度</span><b style="color:var(--blue)">${allItems.filter((t) => t.done).length}/${allItems.length}</b></div>
        <div class="card stat"><span class="muted">今天新商品</span><b>${fresh.length}</b></div>
      </div>
      <section class="card pad stack">
        <h3>快結束了，還沒完成</h3>
        ${soonTasks.map((g) => `<div class="row"><span class="tag">任務</span><b class="grow">${esc(g.name)}</b><b class="soon" style="font-size:14px">剩 ${leftText(g.left)} · ${g.items.length - g.n} 項未完成</b></div>`).join('')}
        ${soonEvents.map((e) => `<div class="row">${tagHtml(catOf(e))}<b class="grow">${esc(e.name)}</b><b class="soon" style="font-size:14px">剩 ${leftText(e.left)}</b></div>`).join('')}
        ${soonTasks.length + soonEvents.length ? '' : '<span class="muted">沒有快結束的項目</span>'}
      </section>
      <section class="stack"><h3>今天新上架</h3>
        ${fresh.length ? `<div class="grid">${fresh.slice(0, 8).map((p) => productCard(p, true)).join('')}</div>` : '<span class="muted">今天沒有新商品</span>'}
        ${fresh.length > 8 ? `<button type="button" class="outline" data-tab="shop" style="align-self:flex-start">看全部 ${fresh.length} 件</button>` : ''}
      </section>`;
  }

  if (ui.tab === 'go') {
    const sel = ui.goCats;
    const filtered = sel.length ? d.activeEvents.filter((e) => sel.includes(catOf(e))) : d.activeEvents;
    const { items, pager } = paginate(sortEvents(filtered), 'go');
    const count = (c) => c === '全部' ? d.activeEvents.length : d.activeEvents.filter((e) => catOf(e) === c).length;
    html = `
      <div class="head"><h2>Pokémon GO 活動</h2><span class="muted">分類可以多選；勾選完成後移到封存，結束的活動也會自動移過去</span></div>
      <div class="pills" aria-label="活動分類">${pillsHtml(CATEGORIES, sel, 'gocat', count)}</div>
      <div class="toolbar only-narrow"><span class="muted">排序</span>${sortButton('type', '類型')}${sortButton('start', '開始')}${sortButton('end', '結束')}</div>
      ${items.length ? `
        <div class="card scroll only-wide"><table>
          <thead><tr><th>完成</th><th>活動</th><th>${sortButton('type', '類型')}</th><th>${sortButton('start', '開始')}</th><th>${sortButton('end', '結束')}</th><th>剩餘</th></tr></thead>
          <tbody>${eventRows(items)}</tbody></table></div>
        <div class="only-narrow stack" style="gap:10px">${eventCards(items)}</div>
        ${pager}` : '<p class="muted">沒有符合的活動</p>'}`;
  }

  if (ui.tab === 'tasks') {
    html = `
      <div class="head"><h2>任務待辦</h2><span class="muted">田野調查來自 LeekDuck，限時調查來自巴哈姆特 Pokémon GO 哈啦板；結束前 ${REMIND_MS / HOUR} 小時還沒完成會發 Discord 提醒</span></div>
      ${(() => { const { items, pager } = paginate(d.activeTasks, 'tasks'); return (items.map(taskGroupHtml).join('') || '<p class="muted">目前沒有任務</p>') + pager; })()}`;
  }

  if (ui.tab === 'shop') {
    const sel = ui.srcs;
    const filtered = sel.length ? d.products.filter((p) => sel.includes(p.source)) : d.products;
    const { items, pager } = paginate(sortProducts(filtered), 'shop');
    const count = (c) => c === '全部' ? d.products.length : d.products.filter((p) => p.source === c).length;
    const sorts = [['new', '上架時間：新到舊'], ['old', '上架時間：舊到新'], ['priceDesc', '價格：高到低'], ['priceAsc', '價格：低到高']];
    html = `
      <div class="head"><h2>新商品</h2><span class="muted">最近 7 天新上架，超過 7 天自動移除；來源可以多選</span></div>
      <div class="toolbar">
        <div class="pills grow" aria-label="來源">${pillsHtml(SOURCES, sel, 'src', count)}</div>
        <label class="muted" style="display:flex;gap:8px;align-items:center">排序
          <select data-shopsort>${sorts.map(([v, l]) => `<option value="${v}" ${v === ui.shopSort ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </label>
      </div>
      ${items.length ? `<div class="grid">${items.map((p) => productCard(p, d.isNew(p))).join('')}</div>${pager}` : '<p class="muted">沒有商品</p>'}`;
  }

  if (ui.tab === 'tw') {
    html = `
      <div class="head"><h2>台灣寶可夢活動</h2><span class="muted">最近 7 天的官網公告和新聞，同一件事只列一次</span></div>
      ${(() => { const { items, pager } = paginate(d.twNews, 'tw'); return (items.map(newsItem).join('') || '<p class="muted">最近沒有新消息</p>') + pager; })()}`;
  }

  if (ui.tab === 'archive') {
    const items = d.archivedTasks.map((g) => ({
      tag: '<span class="tag">任務</span>', name: g.name,
      reason: g.gaveUp ? '已放棄 · 不再提醒' : `已結束 · ${when(g.end)}`,
      restore: g.gaveUp && !g.ended ? `data-flag="gaveUp" data-id="${esc(g.id)}" data-value=""` : '',
    })).concat(d.doneEvents.map((e) => ({
      tag: tagHtml(catOf(e)), name: e.name,
      reason: e.done ? `已完成${e.ended ? ' · 已結束' : ''}` : `已結束 · ${when(e.end)}`,
      restore: e.done && !e.ended ? `data-flag="done" data-id="${esc(e.id)}" data-value=""` : '',
    })));
    html = `
      <div class="head"><h2>封存</h2><span class="muted">已完成、已放棄或已結束的項目；按錯了可以按「復原」</span></div>
      ${(() => { const pg = paginate(items, 'archive'); return pg.items.map((a) => `
        <div class="card pad row">${a.tag}
          <div class="grow stack" style="gap:0"><b>${esc(a.name)}</b><span class="muted" style="font-size:13px">${a.reason}</span></div>
          ${a.restore ? `<button type="button" class="outline" ${a.restore}>復原</button>` : ''}
        </div>`).join('') + pg.pager || '<p class="muted">封存是空的</p>'; })()}`;
  }
  main.innerHTML = html;
}

// ---------- 事件 ----------

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-gocat],[data-src],[data-sort],[data-page],button[data-flag]');
  if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.tab) { ui.tab = ds.tab; try { localStorage.setItem('tab', ui.tab); } catch (e) {} window.scrollTo(0, 0); }
  else if (ds.gocat) { ui.goCats = toggleIn(ui.goCats, ds.gocat); ui.page.go = 1; }
  else if (ds.src) { ui.srcs = toggleIn(ui.srcs, ds.src); ui.page.shop = 1; }
  else if (ds.sort) {
    ui.goSort = ui.goSort.key === ds.sort ? { key: ds.sort, dir: -ui.goSort.dir } : { key: ds.sort, dir: 1 };
    ui.page.go = 1;
  }
  else if (ds.page) { const [k, n] = ds.page.split(':'); ui.page[k] = +n; window.scrollTo(0, 0); }
  else { setFlag(ds.flag, ds.id, !!ds.value); return; }
  render();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.matches('input[data-flag]')) setFlag(t.dataset.flag, t.dataset.id, t.checked);
  if (t.matches('select[data-shopsort]')) { ui.shopSort = t.value; ui.page.shop = 1; render(); }
});

google.script.run
  .withSuccessHandler((result) => {
    data = result;
    document.getElementById('updated').textContent = data.updatedAt ? `最後更新 ${when(data.updatedAt)}` : '還沒有資料，等每日排程跑過一次';
    render();
  })
  .withFailureHandler((err) => {
    document.getElementById('main').innerHTML = `<div class="notice">載入失敗：${esc(err.message)}</div>`;
  })
  .getData();
</script>
</body>
</html>
