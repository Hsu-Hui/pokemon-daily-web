<style>
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --sunk: #ECEEF2; --line: #E1E4EA;
  --ink: #1B1D22; --muted: #5C6370; --red: #CC2E0B; --blue: #1F5FC4;
  --active-bg: #1B1D22; --active-ink: #FFFFFF;
  --cal-today: #FDEBE6; --cal-we: #F7F8FA;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161A; --surface: #1E2127; --sunk: #2A2E36; --line: #343944;
    --ink: #F1F2F4; --muted: #A3A9B5; --red: #FF7A5C; --blue: #7EB0FF;
    --active-bg: #F1F2F4; --active-ink: #14161A;
    --cal-today: #3A2621; --cal-we: #1A1C21;
  }
}
* { box-sizing: border-box; }
body { overflow-wrap: break-word; margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
a { color: var(--blue); }
button { font: inherit; cursor: pointer; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: #CC2E0B; margin: 0; cursor: pointer; flex: none; }

header { background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.brand { display: flex; align-items: center; gap: 12px; padding-top: 18px; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .02em; }
.brand small { display: block; font-size: 13px; color: var(--muted); }
/* 分頁列：單行，窄螢幕可以左右滑 */
nav { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; white-space: nowrap; min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px 12px 0 0; font-weight: 700; background: transparent; color: var(--muted); }
nav button[aria-selected=true] { background: var(--bg); color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
main.wrap { padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }

h2 { margin: 0; font-size: 20px; font-weight: 900; }
h3 { margin: 0; font-size: 17px; font-weight: 700; }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 200px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; }
.stat b { display: block; font-size: 30px; font-weight: 900; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.pill[aria-selected=true] { border-color: var(--active-bg); background: var(--active-bg); color: var(--active-ink); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--sunk); color: var(--ink); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); }
.bar > div { height: 6px; border-radius: 3px; background: var(--blue); }
.soon { color: var(--red) !important; }
.bar.soon > div { background: var(--red); }

table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 12px 8px; }
td { padding: 12px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 16px; }
.col-name { min-width: 240px; }
.col-left { width: 160px; padding-right: 16px; }
.scroll { overflow-x: auto; }
.when { font-size: 14px; white-space: nowrap; }
.th-sort { border: 0; background: transparent; padding: 0; color: inherit; font: inherit; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; min-height: 32px; }
.th-sort[aria-pressed=true] { color: var(--ink); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input.search { font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 180px; max-width: 280px; }
select { font: inherit; font-size: 14px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.pager { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; padding-top: 4px; }
.pager button { min-width: 40px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; }
.pager button[aria-current=page] { background: var(--active-bg); border-color: var(--active-bg); color: var(--active-ink); }
.pager button:disabled { opacity: .4; cursor: default; }
.only-narrow { display: none; }
@media (max-width: 680px) {
  .only-wide { display: none; } .only-narrow { display: flex; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .product .img { height: 120px; }
}

.task { display: flex; gap: 12px; align-items: center; padding: 6px 0; min-height: 32px; }
.task .body { flex: 1 1 auto; min-width: 0; display: flex; gap: 12px; align-items: center; }
.task .text { flex: 1 1 auto; min-width: 0; }
.task .reward { flex: 0 1 45%; margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
/* 手機：獎勵放到任務下一行，任務組標題獨占一行 */
@media (max-width: 600px) {
  .task .body { flex-direction: column; align-items: flex-start; gap: 2px; }
  .task .reward { flex-basis: auto; margin-left: 0; text-align: left; }
  .group-head > .grow { flex-basis: 100%; }
  /* 新聞：日期和星號縮小，標題多留一點寬度 */
  .news-item { gap: 8px; padding: 12px; }
  .news-item .date { min-width: 48px; padding: 4px 6px; }
  .news-item .star { width: 34px; height: 34px; font-size: 17px; }
}
.task.checked .text { text-decoration: line-through; color: var(--muted); }
.ghost { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; }
.outline { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.product { overflow: hidden; display: flex; flex-direction: column; color: inherit; text-decoration: none; }
.product .img { height: 150px; background: var(--sunk) center / contain no-repeat; position: relative; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
.product .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.product .name { font-weight: 700; font-size: 14px; }
.price { font-weight: 700; color: var(--red); }
.new { position: absolute; top: 8px; left: 8px; background: #FFCB05; color: #1B1D22; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }
.date { min-width: 64px; display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--sunk); }
.date b { font-size: 22px; font-weight: 900; line-height: 1.1; }
.date span { font-size: 12px; color: var(--muted); }
.link { color: inherit; text-decoration: none; }
/* 我的最愛的星號：放在連結外面，按了不會打開連結 */
.star { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; }
.star[aria-pressed=true] { color: #E0A800; border-color: #E0A800; }
.news-item { flex-wrap: nowrap; }
.product-wrap { position: relative; display: flex; }
.product-wrap > .product { flex: 1 1 auto; min-width: 0; }
.product-wrap > .star { position: absolute; top: 8px; right: 8px; }
.notice { padding: 10px 14px; border-radius: 12px; background: #FDEBD3; color: #7A4200; font-size: 14px; }
/* 儲存列：固定在最上面 */
.savebar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.savebar:empty { display: none; }
.savebar-inner { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 52px; }
.save { min-height: 40px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--red); color: #FFFFFF; font-weight: 700; }
.save:disabled { background: var(--sunk); color: var(--muted); cursor: default; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--active-bg); color: var(--active-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; display: none; }
/* GO 活動行事曆：第一欄是活動名稱（窄螢幕名稱放在色條上一行），其餘每欄一天 */
.cal { display: grid; grid-auto-rows: minmax(32px, auto); row-gap: 4px; }
.cal-narrow { grid-auto-rows: auto; row-gap: 2px; }
.cal-today { background: var(--cal-today); border-radius: 8px; }
.cal-we { background: var(--cal-we); }
.cal-day { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); line-height: 1.2; padding: 4px 0; z-index: 1; }
.cal-day b { font-size: 14px; color: var(--ink); }
.cal-day.we b { color: var(--red); }
.cal-day.today, .cal-day.today b { color: var(--red); font-weight: 700; }
.cal-name { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 10px; font-size: 13px; font-weight: 700; z-index: 1; }
.cal-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-narrow .cal-name { grid-column: 2 / -1; padding: 6px 2px 0; font-size: 12px; }
.cal-narrow .cal-name .cal-dot { display: none; }
.cal-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.cal-bar { display: flex; align-items: center; min-height: 26px; margin: 3px 2px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #1B1D22; text-decoration: none; white-space: nowrap; overflow: hidden; z-index: 1; }
.cal-narrow .cal-bar { min-height: 22px; margin: 0 1px; padding: 0 6px; font-size: 11px; }
.cal-bar.one { justify-content: center; padding: 0 2px; }
.cal-bar.cut-l { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.cal-bar.cut-r { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.cal-legend { gap: 6px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.field { font: inherit; font-size: 15px; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
textarea.field { resize: vertical; line-height: 1.6; }
</style>
